name: P1 document AI

on:
  push:
    branches: ["person-1"]
    paths: ["document-ai/**", ".github/workflows/p1-document-ai.yml"]
  pull_request:
    paths: ["document-ai/**", ".github/workflows/p1-document-ai.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p1-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: document-ai

jobs:
  unit:
    name: Unit tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            lock: requirements/py312-windows.lock
          - os: ubuntu-latest
            lock: requirements/py312-linux.lock
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install from hash-locked requirements
        run: |
          python -m pip install --require-hashes -r ${{ matrix.lock }}
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check
      - name: Contract artifacts are current
        run: |
          python scripts/export_schema.py --check
          python scripts/make_conformance.py --check
      - name: Unit tests (no native engines needed)
        run: python -m pytest tests/unit -q -ra

  real-engines:
    name: Real Tesseract + Docling (Windows)
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PATHYA_REQUIRE_REAL_ENGINES: "1"
      PATHYA_DOCLING_ARTIFACTS: ${{ github.workspace }}\document-ai\local\docling-models
      PATHYA_TESSDATA_DIR: ${{ github.workspace }}\document-ai\local\tessdata
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install from hash-locked requirements
        run: |
          python -m pip install --require-hashes -r requirements/py312-windows.lock
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Install Tesseract
        run: |
          choco install tesseract --no-progress -y
          echo "PATHYA_TESSERACT_CMD=C:\Program Files\Tesseract-OCR\tesseract.exe" >> $env:GITHUB_ENV
      - name: Cache pinned model files
        uses: actions/cache@v4
        with:
          path: document-ai/local
          key: models-${{ hashFiles('document-ai/requirements/models.lock.json') }}
      - name: Fetch pinned models (verified SHA-256)
        run: python scripts/fetch_models.py --download
      - name: Environment report
        run: python scripts/check_environment.py --require-tesseract --require-docling --verify-hashes
      - name: Integration tests (skips are failures here)
        run: python -m pytest tests/integration -q -ra
