[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "pathya-document-ai"
version = "0.1.0"
description = "Pathya P1: structured, source-preserving textbook extraction"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pdfplumber==0.11.9",
    "pypdfium2==5.13.0",
    "Pillow==11.3.0",
    "numpy==1.26.4",
    "opencv-python-headless==4.11.0.86",
    "pytesseract==0.3.13",
    "docling==2.70.0",
    "pydantic==2.12.2",
    "jsonschema==4.25.1",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2"]
lock = ["pip-tools==7.5.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers -ra"
markers = [
    "integration: checks using real installed libraries or external engines",
]

